<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1490" viewBox="0 0 1900 1490" role="img" aria-label="Fabric streaming: deployed services and three data flows"><title>Fabric streaming: deployed services and three data flows</title><defs><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#0078D4"/></marker><marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#5C2D91"/></marker><marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#107C10"/></marker><marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#F7630C"/></marker><marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#495057"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Segoe UI,Arial,sans-serif"><text x="45" y="62" font-size="34" font-weight="700" fill="#000000"><tspan x="45" dy="0">Fabric Eventstream + Spark | Data architecture</tspan></text><text x="45" y="104" font-size="21" font-weight="400" fill="#000000"><tspan x="45" dy="0">MCAP / West US 3 | Workspace ES_EH_Spark_test | Capacity fabricessparktest8 (F8)</tspan></text><rect x="45" y="135" width="1810" height="1020" rx="14" fill="none" stroke="#495057" stroke-width="2"/><text x="63" y="172" font-size="23" font-weight="700" fill="#000000"><tspan x="63" dy="0">Logical services and processing paths</tspan></text><rect x="55" y="190" width="365" height="240" rx="14" fill="none" stroke="#0078D4" stroke-width="2"/><text x="73" y="227" font-size="23" font-weight="700" fill="#000000"><tspan x="73" dy="0">VM PERIMETER</tspan></text><rect x="490" y="190" width="1350" height="925" rx="14" fill="none" stroke="#5C2D91" stroke-width="2"/><text x="508" y="227" font-size="23" font-weight="700" fill="#000000"><tspan x="508" dy="0">FABRIC PERIMETER | workspace + managed Spark</tspan></text><rect x="55" y="700" width="365" height="425" rx="14" fill="none" stroke="#107C10" stroke-width="2"/><text x="73" y="737" font-size="23" font-weight="700" fill="#000000"><tspan x="73" dy="0">API PERIMETER</tspan></text><rect x="75" y="235" width="300" height="155" rx="14" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/><text x="93" y="272" font-size="23" font-weight="700" fill="#000000"><tspan x="93" dy="0">IoT simulator</tspan></text><text x="93" y="308" font-size="18" font-weight="400" fill="#000000"><tspan x="93" dy="0">vmesehspark / Python</tspan><tspan x="93" dy="25.2">equipment_id 0-100</tspan><tspan x="93" dy="25.2">10% temperature &gt; 80</tspan></text><rect x="515" y="235" width="390" height="155" rx="14" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/><text x="533" y="272" font-size="23" font-weight="700" fill="#000000"><tspan x="533" dy="0">Eventstream: esspark</tspan></text><text x="533" y="308" font-size="18" font-weight="400" fill="#000000"><tspan x="533" dy="0">Custom endpoint input</tspan><tspan x="533" dy="25.2">Original stream + derived stream</tspan><tspan x="533" dy="25.2">Derived filter: temperature &gt; 80</tspan></text><rect x="1120" y="235" width="320" height="155" rx="14" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/><text x="1138" y="272" font-size="23" font-weight="700" fill="#000000"><tspan x="1138" dy="0">Eventhouse: ehspark</tspan></text><text x="1138" y="308" font-size="18" font-weight="400" fill="#000000"><tspan x="1138" dy="0">KQL database: ehspark</tspan><tspan x="1138" dy="25.2">RawEvents: original payloads</tspan><tspan x="1138" dy="25.2">OneLake availability enabled</tspan></text><rect x="1520" y="235" width="305" height="155" rx="14" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/><text x="1538" y="272" font-size="23" font-weight="700" fill="#000000"><tspan x="1538" dy="0">OneLake availability</tspan></text><text x="1538" y="308" font-size="18" font-weight="400" fill="#000000"><tspan x="1538" dy="0">Eventhouse-managed data</tspan><tspan x="1538" dy="25.2">Lakehouse RawEvents shortcut</tspan><tspan x="1538" dy="25.2">Not a Spark-owned Delta copy</tspan></text><polyline points="375,300 515,300" fill="none" stroke="#0078D4" stroke-width="3"  marker-end="url(#arrow-blue)"/><text x="390" y="261" font-size="17" font-weight="400" fill="#000000"><tspan x="390" dy="0">Private</tspan><tspan x="390" dy="23.799999999999997">custom input</tspan></text><polyline points="905,300 1120,300" fill="none" stroke="#5C2D91" stroke-width="3"  marker-end="url(#arrow-purple)"/><text x="928" y="268" font-size="16" font-weight="400" fill="#000000"><tspan x="928" dy="0">1 / Original stream</tspan><tspan x="928" dy="22.4">Eventhouse destination</tspan></text><polyline points="1440,300 1520,300" fill="none" stroke="#5C2D91" stroke-width="3"  marker-end="url(#arrow-purple)"/><text x="1455" y="354" font-size="19" font-weight="700" fill="#000000"><tspan x="1455" dy="0">1</tspan></text><rect x="515" y="550" width="470" height="240" rx="14" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/><text x="533" y="587" font-size="23" font-weight="700" fill="#000000"><tspan x="533" dy="0">Spark: esehnotebookspark</tspan></text><text x="533" y="623" font-size="18" font-weight="400" fill="#000000"><tspan x="533" dy="0">Read derived Kafka custom endpoint</tspan><tspan x="533" dy="25.2">Expand JSON-array envelopes</tspan><tspan x="533" dy="25.2">Per trigger: KQL enrichment, then API</tspan><tspan x="533" dy="25.2">Durable staged Delta writes + replay guards</tspan><tspan x="533" dy="25.2">Medium Starter Pool; dynamic executors 1-5</tspan></text><polyline points="710,390 710,550" fill="none" stroke="#0078D4" stroke-width="3"  marker-end="url(#arrow-blue)"/><text x="732" y="462" font-size="20" font-weight="400" fill="#000000"><tspan x="732" dy="0">2 + 3 / Derived stream</tspan><tspan x="732" dy="28.0">Kafka over private route</tspan></text><polyline points="985,610 1040,610 1040,430 1270,430 1270,390" fill="none" stroke="#5C2D91" stroke-width="3"  marker-end="url(#arrow-purple)"/><text x="1080" y="471" font-size="18" font-weight="400" fill="#000000"><tspan x="1080" dy="0">KQL request / result</tspan><tspan x="1080" dy="25.2">Same equipment_id; [trigger - 20 min, trigger]</tspan><tspan x="1080" dy="25.2">Average temperature; valid-empty fallback = trigger value</tspan></text><rect x="75" y="480" width="300" height="155" rx="14" fill="#F3F2F1" stroke="#495057" stroke-width="2"/><text x="93" y="517" font-size="23" font-weight="700" fill="#000000"><tspan x="93" dy="0">Key Vault</tspan></text><text x="93" y="553" font-size="18" font-weight="400" fill="#000000"><tspan x="93" dy="0">esehsparkkv</tspan><tspan x="93" dy="25.2">Endpoint / API credentials</tspan><tspan x="93" dy="25.2">Spark managed private link</tspan></text><polyline points="375,560 515,600" fill="none" stroke="#495057" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/><text x="390" y="521" font-size="16" font-weight="400" fill="#000000"><tspan x="390" dy="0">Secrets</tspan><tspan x="390" dy="22.4">private access</tspan></text><rect x="75" y="745" width="300" height="190" rx="14" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/><text x="93" y="782" font-size="23" font-weight="700" fill="#000000"><tspan x="93" dy="0">Scoring Function</tspan></text><text x="93" y="818" font-size="18" font-weight="400" fill="#000000"><tspan x="93" dy="0">esehspark-score-api</tspan><tspan x="93" dy="25.2">Per-event authenticated HTTPS</tspan><tspan x="93" dy="25.2">equipment_id + timestamp + avg</tspan><tspan x="93" dy="25.2">Random integer 1-100</tspan><tspan x="93" dy="25.2">Idempotency + conflict check</tspan></text><polyline points="515,700 440,700 440,800 375,800" fill="none" stroke="#107C10" stroke-width="3"  marker-end="url(#arrow-green)"/><text x="390" y="673" font-size="17" font-weight="400" fill="#000000"><tspan x="390" dy="0">2 / API call</tspan></text><polyline points="375,875 475,875 475,755 515,755" fill="none" stroke="#107C10" stroke-width="3"  marker-end="url(#arrow-green)"/><text x="390" y="918" font-size="16" font-weight="400" fill="#000000"><tspan x="390" dy="0">Score / failure</tspan></text><rect x="1130" y="595" width="315" height="145" rx="14" fill="#FFF4CE" stroke="#F7630C" stroke-width="2"/><text x="1148" y="632" font-size="23" font-weight="700" fill="#000000"><tspan x="1148" dy="0">lhspark.Events</tspan></text><text x="1148" y="668" font-size="18" font-weight="400" fill="#000000"><tspan x="1148" dy="0">equipment_id, timestamp</tspan><tspan x="1148" dy="25.2">Calculated temperature</tspan><tspan x="1148" dy="25.2">Written before the API call</tspan></text><polyline points="985,665 1130,665" fill="none" stroke="#F7630C" stroke-width="3"  marker-end="url(#arrow-orange)"/><text x="1000" y="644" font-size="17" font-weight="400" fill="#000000"><tspan x="1000" dy="0">3 / Events</tspan></text><rect x="1130" y="850" width="315" height="145" rx="14" fill="#FFF4CE" stroke="#F7630C" stroke-width="2"/><text x="1148" y="887" font-size="23" font-weight="700" fill="#000000"><tspan x="1148" dy="0">lhspark.Scores</tspan></text><text x="1148" y="923" font-size="18" font-weight="400" fill="#000000"><tspan x="1148" dy="0">equipment_id, timestamp</tspan><tspan x="1148" dy="25.2">API number 1-100</tspan><tspan x="1148" dy="25.2">Successful API outcomes only</tspan></text><polyline points="985,745 1060,745 1060,920 1130,920" fill="none" stroke="#F7630C" stroke-width="3"  marker-end="url(#arrow-orange)"/><text x="1000" y="984" font-size="17" font-weight="400" fill="#000000"><tspan x="1000" dy="0">2 / Scores</tspan></text><rect x="1520" y="595" width="305" height="240" rx="14" fill="#FFF4CE" stroke="#F7630C" stroke-width="2"/><text x="1538" y="632" font-size="23" font-weight="700" fill="#000000"><tspan x="1538" dy="0">Lakehouse: lhspark</tspan></text><text x="1538" y="668" font-size="18" font-weight="400" fill="#000000"><tspan x="1538" dy="0">ProcessingAudit: durable stages</tspan><tspan x="1538" dy="25.2">Quarantine: processing failures</tspan><tspan x="1538" dy="25.2">Checkpoint + diagnostic files</tspan><tspan x="1538" dy="25.2">Events retained after API failure</tspan><tspan x="1538" dy="25.2">RawEvents is a KQL shortcut</tspan></text><polyline points="985,780 1010,780 1010,1095 1660,1095 1660,835" fill="none" stroke="#495057" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/><text x="1130" y="1078" font-size="18" font-weight="400" fill="#000000"><tspan x="1130" dy="0">Operational state, failed records and recovery evidence</tspan></text><rect x="75" y="960" width="300" height="145" rx="14" fill="#F3F2F1" stroke="#495057" stroke-width="2"/><text x="93" y="997" font-size="23" font-weight="700" fill="#000000"><tspan x="93" dy="0">API backing services</tspan></text><text x="93" y="1033" font-size="18" font-weight="400" fill="#000000"><tspan x="93" dy="0">B1 plan: asp-esehspark-score</tspan><tspan x="93" dy="25.2">Storage: esehsparkstore8</tspan><tspan x="93" dy="25.2">Table storage: durable scores</tspan></text><polyline points="225,935 225,960" fill="none" stroke="#495057" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/><rect x="45" y="1190" width="1810" height="250" rx="14" fill="#F3F2F1" stroke="#495057" stroke-width="2"/><text x="63" y="1227" font-size="23" font-weight="700" fill="#000000"><tspan x="63" dy="0">Reading this diagram</tspan></text><text x="63" y="1263" font-size="18" font-weight="400" fill="#000000"><tspan x="63" dy="0">1  Raw path: simulator -&gt; esspark -&gt; ehspark.RawEvents -&gt; OneLake availability -&gt; lhspark.RawEvents shortcut.</tspan><tspan x="63" dy="25.2">2  Scoring path: filtered Kafka -&gt; Spark -&gt; per-event KQL average -&gt; private REST API -&gt; lhspark.Scores.</tspan><tspan x="63" dy="25.2">3  Event path: the same KQL enrichment -&gt; lhspark.Events, independently of API success.</tspan><tspan x="63" dy="25.2">Blue VM, purple Fabric and green API outlines are logical perimeters. Key Vault is a shared Azure dependency outside those three.</tspan><tspan x="63" dy="25.2">Solid arrows = application data or request/result path. Dashed arrows = supporting secrets, storage or recovery state.</tspan><tspan x="63" dy="25.2">Current design retains staged recovery/audit commits; the proposed two-commit redesign is NOT deployed.</tspan><tspan x="63" dy="25.2">Fabric items are capacity/workspace-scoped SaaS artifacts, not individual ARM resources in the Azure resource group.</tspan></text></g></svg>