<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1780" viewBox="0 0 1900 1780" role="img" aria-label="Fabric streaming: private networking and Azure resource inventory"><title>Fabric streaming: private networking and Azure resource inventory</title><defs><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#0078D4"/></marker><marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#5C2D91"/></marker><marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#107C10"/></marker><marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#F7630C"/></marker><marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#495057"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Segoe UI,Arial,sans-serif"><text x="45" y="62" font-size="34" font-weight="700" fill="#000000"><tspan x="45" dy="0">Private access + provisioned services</tspan></text><text x="45" y="104" font-size="21" font-weight="400" fill="#000000"><tspan x="45" dy="0">Azure resources: rg_esehspark / West US 3 | Fabric workspace and managed network shown separately</tspan></text><rect x="45" y="130" width="1810" height="115" rx="14" fill="#FFF4CE" stroke="#F7630C" stroke-width="2"/><text x="63" y="167" font-size="23" font-weight="700" fill="#000000"><tspan x="63" dy="0">Current security posture - intentional deviation from the original OAP requirement</tspan></text><text x="63" y="203" font-size="18" font-weight="400" fill="#000000"><tspan x="63" dy="0">Workspace inbound = Deny (Private Link required); outbound = Allow (OAP OFF by explicit user direction).</tspan><tspan x="63" dy="25.2">Scoring Function public access = Disabled. Public workspace/API tests were network-denied; not every resource is universally private-only.</tspan></text><rect x="45" y="285" width="865" height="865" rx="14" fill="none" stroke="#0078D4" stroke-width="2"/><text x="63" y="322" font-size="23" font-weight="700" fill="#000000"><tspan x="63" dy="0">Customer VNet: vnet_esehspark / 10.74.0.0/16</tspan></text><rect x="65" y="580" width="375" height="260" rx="14" fill="none" stroke="#0078D4" stroke-width="2"/><text x="83" y="617" font-size="23" font-weight="700" fill="#000000"><tspan x="83" dy="0">VM PERIMETER</tspan></text><rect x="80" y="365" width="345" height="160" rx="14" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/><text x="98" y="402" font-size="23" font-weight="700" fill="#000000"><tspan x="98" dy="0">AzureBastionSubnet</tspan></text><text x="98" y="438" font-size="18" font-weight="400" fill="#000000"><tspan x="98" dy="0">10.74.0.0/26</tspan><tspan x="98" dy="25.2">bas-esehspark + Bastion public IP</tspan><tspan x="98" dy="25.2">Operator browser -&gt; Bastion</tspan></text><rect x="80" y="630" width="345" height="180" rx="14" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/><text x="98" y="667" font-size="23" font-weight="700" fill="#000000"><tspan x="98" dy="0">vm-subnet / 10.74.1.0/24</tspan></text><text x="98" y="703" font-size="18" font-weight="400" fill="#000000"><tspan x="98" dy="0">vmesehspark (Windows D2s_v5)</tspan><tspan x="98" dy="25.2">NIC + 127 GiB managed OS disk</tspan><tspan x="98" dy="25.2">nsg-esehspark-vm: Bastion RDP</tspan><tspan x="98" dy="25.2">Python IoT emitter / private client</tspan></text><polyline points="250,525 250,630" fill="none" stroke="#0078D4" stroke-width="3"  marker-end="url(#arrow-blue)"/><text x="270" y="576" font-size="18" font-weight="400" fill="#000000"><tspan x="270" dy="0">RDP 3389</tspan></text><rect x="485" y="470" width="385" height="280" rx="14" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/><text x="503" y="507" font-size="23" font-weight="700" fill="#000000"><tspan x="503" dy="0">private-endpoints / 10.74.2.0/24</tspan></text><text x="503" y="543" font-size="18" font-weight="400" fill="#000000"><tspan x="503" dy="0">pe-esehspark-fabric-workspace</tspan><tspan x="503" dy="25.2">pe-esehspark-api</tspan><tspan x="503" dy="25.2">pe-esehspark-kv</tspan><tspan x="503" dy="25.2">pe-esehspark-storage-blob</tspan><tspan x="503" dy="25.2">pe-esehspark-storage-table</tspan><tspan x="503" dy="25.2">pe-esehspark-storage-queue / file</tspan></text><polyline points="425,690 485,690" fill="none" stroke="#5C2D91" stroke-width="3"  marker-end="url(#arrow-purple)"/><text x="440" y="777" font-size="17" font-weight="400" fill="#000000"><tspan x="440" dy="0">TLS + private DNS</tspan></text><rect x="485" y="830" width="385" height="140" rx="14" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/><text x="503" y="867" font-size="23" font-weight="700" fill="#000000"><tspan x="503" dy="0">app-integration / 10.74.3.0/26</tspan></text><text x="503" y="903" font-size="18" font-weight="400" fill="#000000"><tspan x="503" dy="0">App Service delegated subnet</tspan><tspan x="503" dy="25.2">Function outbound VNet integration</tspan></text><rect x="80" y="930" width="345" height="160" rx="14" fill="#F3F2F1" stroke="#495057" stroke-width="2"/><text x="98" y="967" font-size="23" font-weight="700" fill="#000000"><tspan x="98" dy="0">Controlled VM egress</tspan></text><text x="98" y="1003" font-size="18" font-weight="400" fill="#000000"><tspan x="98" dy="0">nat-esehspark + NAT public IP</tspan><tspan x="98" dy="25.2">Attached to vm-subnet</tspan><tspan x="98" dy="25.2">Not the Eventstream data path</tspan></text><polyline points="250,810 250,930" fill="none" stroke="#495057" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/><rect x="985" y="270" width="885" height="345" rx="14" fill="none" stroke="#5C2D91" stroke-width="2"/><text x="1003" y="307" font-size="23" font-weight="700" fill="#000000"><tspan x="1003" dy="0">FABRIC PERIMETER | separate managed boundary</tspan></text><rect x="1000" y="320" width="855" height="275" rx="14" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/><text x="1018" y="357" font-size="23" font-weight="700" fill="#000000"><tspan x="1018" dy="0">Fabric workspace / Spark network</tspan></text><text x="1018" y="393" font-size="18" font-weight="400" fill="#000000"><tspan x="1018" dy="0">ES_EH_Spark_test on F8 fabricessparktest8; Eventstream, Eventhouse, Lakehouse and notebooks.</tspan><tspan x="1018" dy="25.2">Workspace Private Link via pl-fabric-esehspark and customer-VNet workspace private endpoint.</tspan><tspan x="1018" dy="25.2">Spark MPE mpe-esehspark-score-api -&gt; Function private-link target (sites).</tspan><tspan x="1018" dy="25.2">Spark MPE mpe-esehsparkkv -&gt; Key Vault private-link target (vault).</tspan><tspan x="1018" dy="25.2">Derived custom-endpoint Kafka route resolves privately; no separately owned Event Hubs namespace.</tspan><tspan x="1018" dy="25.2">Configured max: 5 executors; observed test peak: 2 executors + driver = 24 total cores.</tspan></text><polyline points="870,510 1000,440" fill="none" stroke="#5C2D91" stroke-width="3"  marker-end="url(#arrow-purple)"/><text x="900" y="487" font-size="17" font-weight="400" fill="#000000"><tspan x="900" dy="0">WSPL</tspan></text><rect x="1030" y="650" width="400" height="280" rx="14" fill="none" stroke="#107C10" stroke-width="2"/><text x="1048" y="687" font-size="23" font-weight="700" fill="#000000"><tspan x="1048" dy="0">API PERIMETER</tspan></text><rect x="1050" y="700" width="345" height="190" rx="14" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/><text x="1068" y="737" font-size="23" font-weight="700" fill="#000000"><tspan x="1068" dy="0">Scoring API</tspan></text><text x="1068" y="773" font-size="18" font-weight="400" fill="#000000"><tspan x="1068" dy="0">esehspark-score-api</tspan><tspan x="1068" dy="25.2">asp-esehspark-score / B1</tspan><tspan x="1068" dy="25.2">Public access disabled</tspan><tspan x="1068" dy="25.2">VM PE and Spark MPE are distinct</tspan></text><polyline points="1220,615 1220,700" fill="none" stroke="#107C10" stroke-width="3"  marker-end="url(#arrow-green)"/><text x="1240" y="637" font-size="17" font-weight="400" fill="#000000"><tspan x="1240" dy="0">Spark MPE / HTTPS</tspan></text><polyline points="870,620 950,620 950,795 1050,795" fill="none" stroke="#107C10" stroke-width="3"  marker-end="url(#arrow-green)"/><polyline points="1050,860 930,860 930,905 870,905" fill="none" stroke="#107C10" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-green)"/><text x="920" y="941" font-size="16" font-weight="400" fill="#000000"><tspan x="920" dy="0">VNet integration</tspan></text><rect x="1480" y="700" width="335" height="170" rx="14" fill="#F3F2F1" stroke="#495057" stroke-width="2"/><text x="1498" y="737" font-size="23" font-weight="700" fill="#000000"><tspan x="1498" dy="0">Key Vault</tspan></text><text x="1498" y="773" font-size="18" font-weight="400" fill="#000000"><tspan x="1498" dy="0">esehsparkkv</tspan><tspan x="1498" dy="25.2">Function / VM managed identities</tspan><tspan x="1498" dy="25.2">Notebook submitter secret-read role</tspan></text><polyline points="1640,615 1640,700" fill="none" stroke="#495057" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/><text x="1655" y="642" font-size="17" font-weight="400" fill="#000000"><tspan x="1655" dy="0">Spark MPE</tspan></text><polyline points="1395,760 1480,760" fill="none" stroke="#495057" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/><rect x="1030" y="950" width="805" height="195" rx="14" fill="none" stroke="#107C10" stroke-width="2"/><text x="1048" y="987" font-size="23" font-weight="700" fill="#000000"><tspan x="1048" dy="0">API SUPPORTING STORAGE</tspan></text><rect x="1050" y="995" width="765" height="140" rx="14" fill="#F3F2F1" stroke="#495057" stroke-width="2"/><text x="1068" y="1032" font-size="23" font-weight="700" fill="#000000"><tspan x="1068" dy="0">Function storage: esehsparkstore8</tspan></text><text x="1068" y="1068" font-size="18" font-weight="400" fill="#000000"><tspan x="1068" dy="0">Blob / File / Queue / Table private endpoints and private DNS.</tspan><tspan x="1068" dy="25.2">Table data: durable scoring idempotency. Storage also supports the Function runtime.</tspan><tspan x="1068" dy="25.2">Storage Event Grid system topic exists; it is not one of the three streaming paths.</tspan></text><polyline points="1220,890 1220,995" fill="none" stroke="#495057" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-gray)"/><rect x="45" y="1200" width="865" height="310" rx="14" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/><text x="63" y="1237" font-size="23" font-weight="700" fill="#000000"><tspan x="63" dy="0">Private DNS zones linked to the VNet</tspan></text><text x="63" y="1273" font-size="18" font-weight="400" fill="#000000"><tspan x="63" dy="0">privatelink.fabric.microsoft.com</tspan><tspan x="63" dy="25.2">privatelink.azurewebsites.net</tspan><tspan x="63" dy="25.2">privatelink.vaultcore.azure.net</tspan><tspan x="63" dy="25.2">privatelink.blob.core.windows.net</tspan><tspan x="63" dy="25.2">privatelink.table.core.windows.net</tspan><tspan x="63" dy="25.2">privatelink.queue.core.windows.net</tspan><tspan x="63" dy="25.2">privatelink.file.core.windows.net</tspan><tspan x="63" dy="25.2">Fabric workspace endpoint also supplies service-specific private routing/DNS records.</tspan></text><rect x="1000" y="1200" width="855" height="310" rx="14" fill="#F3F2F1" stroke="#495057" stroke-width="2"/><text x="1018" y="1237" font-size="23" font-weight="700" fill="#000000"><tspan x="1018" dy="0">Scope, ownership and operational controls</tspan></text><text x="1018" y="1273" font-size="18" font-weight="400" fill="#000000"><tspan x="1018" dy="0">Azure RG: capacity, VNet/subnets, NSG, NAT, Bastion/public IPs, VM/NIC/disk,</tspan><tspan x="1018" dy="25.2">Function/plan, Key Vault, storage/private endpoints/DNS, Fabric Private Link service.</tspan><tspan x="1018" dy="25.2">Perimeters: VM = guest emitter; Fabric = workspace/managed Spark; API = Function/plan.</tspan><tspan x="1018" dy="25.2">API storage is separately outlined; Key Vault and the customer VNet are shared dependencies.</tspan><tspan x="1018" dy="25.2">VM extensions observed: AADLoginForWindows and MDE.Windows.</tspan><tspan x="1018" dy="25.2">PowerShell/ARM/Bicep + Fabric REST provision and operate the environment.</tspan><tspan x="1018" dy="25.2">After each stress run: drain -&gt; stop owned stream -&gt; OPTIMIZE Events, Scores,</tspan><tspan x="1018" dy="25.2">ProcessingAudit and Quarantine. Do not OPTIMIZE the mirrored RawEvents shortcut.</tspan><tspan x="1018" dy="25.2">No automatic capacity suspension or VM deallocation under the current instruction.</tspan></text><rect x="45" y="1550" width="1810" height="170" rx="14" fill="#F3F2F1" stroke="#495057" stroke-width="2"/><text x="63" y="1587" font-size="23" font-weight="700" fill="#000000"><tspan x="63" dy="0">Evidence and interpretation</tspan></text><text x="63" y="1623" font-size="18" font-weight="400" fill="#000000"><tspan x="63" dy="0">Azure resource names/types refreshed by read-only ARM inventory on 2026-11-05; links checked against deployed source and retained private-route evidence.</tspan><tspan x="63" dy="25.2">Fabric behavior/security state reflects the latest verified session evidence; no new load, endpoint probe, policy change or cloud write was performed for this document.</tspan><tspan x="63" dy="25.2">Only Azure resources belong to rg_esehspark. Fabric workspace contents are represented alongside it for architecture context, not as ARM child resources.</tspan></text></g></svg>